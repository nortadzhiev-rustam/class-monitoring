# npm run dist:teacher  ->  release/teacher/
appId: school.classmonitor.teacher
productName: ClassMonitor Teacher
directories:
  output: release/teacher
files:
  - dist/teacher/**
  - package.json
extraMetadata:
  main: dist/teacher/main.js

mac:
  category: public.app-category.education
  # Rendered from build/icon-teacher.svg by `npm run icons`.
  icon: build/icon-teacher.png
  target: dmg

win:
  # x64 only: built on an Apple-silicon Mac, electron-builder would otherwise
  # make ARM installers that ordinary Intel/AMD lab PCs can't run.
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon-teacher.png
nsis:
  oneClick: false
  perMachine: true
  # Opens TCP 47801 so student agents can connect.
  include: build/teacher-installer.nsh
