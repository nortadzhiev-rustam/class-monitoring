# npm run dist:teacher  ->  release/teacher/
appId: school.classmonitor.teacher
# The name people see (Tajik: "lookout, teacher"). The Windows program file and
# folder keep the original name (win.executableName), so updates install over
# earlier versions and the installer's firewall rule still finds the program.
#
# ӯ is written as у + combining macron (ӯ, Unicode NFD): electron-builder
# names the Mac app's files in that form, and if the name in Info.plist is the
# one-character ӯ instead, Electron can't find its helper apps and crashes at
# launch on Apple silicon. tests/unit/build-config.test.ts keeps it that way.
productName: "Дидбон Омӯзгор"
directories:
  output: release/teacher
files:
  - dist/teacher/**
  - package.json
extraMetadata:
  main: dist/teacher/main.js

mac:
  category: public.app-category.education
  # Rendered from build/icon-teacher.svg by `npm run icons`.
  icon: build/icon-teacher.png
  target: dmg
  artifactName: Didbon-Teacher-${version}-${arch}.${ext}

win:
  # x64 only: built on an Apple-silicon Mac, electron-builder would otherwise
  # make ARM installers that ordinary Intel/AMD lab PCs can't run.
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon-teacher.png
  executableName: ClassMonitor Teacher
nsis:
  artifactName: Didbon-Teacher-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  # Opens TCP 47801 so student agents can connect.
  include: build/teacher-installer.nsh
