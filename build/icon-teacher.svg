<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ClassMonitor Teacher: the console's brand mark (light ring around an accent
       square) with a grid of student screens. Render with `npm run icons`. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3c0f8"/>
      <stop offset="1" stop-color="#6f97ee"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7ef4"/>
      <stop offset="1" stop-color="#2356d2"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1a3a" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1a3a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ring)" filter="url(#tile-shadow)"/>
  <rect x="226" y="226" width="572" height="572" rx="70" fill="url(#core)" filter="url(#soft)"/>
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="318" y="318" width="170" height="170" rx="34"/>
    <rect x="536" y="318" width="170" height="170" rx="34"/>
    <rect x="318" y="536" width="170" height="170" rx="34"/>
    <rect x="536" y="536" width="170" height="170" rx="34"/>
  </g>
</svg>
