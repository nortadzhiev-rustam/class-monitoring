<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>ClassMonitor</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L8 14"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M8 16v1h8l4 3V9h-2"/></symbol>
    <symbol id="i-hand-in" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M5 3l14 7.5-6.2 1.7L10 19z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></symbol>
    <symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  </svg>

  <div id="dock" data-open="false">
    <div class="bar" id="bar" role="toolbar" aria-label="ClassMonitor">
      <div class="who">
        <span class="dot" aria-hidden="true"></span>
        <span class="names"><strong id="teacher">Your teacher</strong><small id="room"></small></span>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button class="tool" id="hand" type="button" aria-pressed="false">
        <svg><use href="#i-hand"/></svg><span class="label">Raise hand</span>
      </button>
      <button class="tool" id="chat" type="button">
        <svg><use href="#i-chat"/></svg><span class="label">Chat</span><span class="badge" id="unread" hidden></span>
      </button>
      <button class="tool" id="hand-in" type="button" hidden>
        <svg><use href="#i-hand-in"/></svg><span class="label">Hand in work</span>
      </button>
      <div class="chips" id="chips"></div>
      <button class="tool icon" id="hide" type="button" title="Hide" aria-label="Hide the toolbar"><svg><use href="#i-up"/></svg></button>
    </div>
    <div class="tab" id="tab" aria-hidden="true">
      <span class="dot"></span><svg><use href="#i-down"/></svg>
    </div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
