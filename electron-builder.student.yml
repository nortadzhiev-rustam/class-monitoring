# npm run dist:student  ->  release/student/
appId: school.classmonitor.student
# The name people see (Tajik: "lookout, pupil"). The Windows program file and
# folder keep the original name (win.executableName), so updates install over
# earlier versions and the installer's firewall rule and taskkill still find it.
productName: Дидбон Хонанда
directories:
  output: release/student
files:
  - dist/student/**
  - package.json
extraMetadata:
  main: dist/student/main.js

mac:
  category: public.app-category.education
  # Rendered from build/icon-student.svg by `npm run icons`.
  icon: build/icon-student.png
  target: pkg
  artifactName: Didbon-Student-${version}-${arch}.${ext}
  extendInfo:
    # Menu-bar agent: no Dock icon.
    LSUIElement: true
    # Shown when macOS asks the student to allow Automation (browsers for website rules, System Events for power).
    NSAppleEventsUsageDescription: Дидбон Хонанда reads and changes the address in your web browser so your teacher's website rules apply, and restarts or shuts down the computer when your teacher asks.
  extraResources:
    - from: native-bin/darwin
      to: native-bin/darwin

win:
  # x64 only: built on an Apple-silicon Mac, electron-builder would otherwise
  # make ARM installers that ordinary Intel/AMD lab PCs can't run.
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon-student.png
  executableName: ClassMonitor Student
  extraResources:
    - from: native/windows
      to: native/windows
nsis:
  # Silent, machine-wide install for deployment tools: "Didbon-Student-Setup-<version>.exe /S"
  oneClick: true
  artifactName: Didbon-Student-Setup-${version}.${ext}
  perMachine: true
  # Opens UDP 47800 for teacher discovery beacons.
  include: build/student-installer.nsh
