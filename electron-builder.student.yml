# npm run dist:student  ->  release/student/
appId: school.classmonitor.student
productName: ClassMonitor Student
directories:
  output: release/student
files:
  - dist/student/**
  - package.json
extraMetadata:
  main: dist/student/main.js

mac:
  category: public.app-category.education
  # Rendered from build/icon-student.svg by `npm run icons`.
  icon: build/icon-student.png
  target: pkg
  extendInfo:
    # Menu-bar agent: no Dock icon.
    LSUIElement: true
    # Shown when macOS asks the student to allow Automation (browsers for website rules, System Events for power).
    NSAppleEventsUsageDescription: ClassMonitor Student reads and changes the address in your web browser so your teacher's website rules apply, and restarts or shuts down the computer when your teacher asks.
  extraResources:
    - from: native-bin/darwin
      to: native-bin/darwin

win:
  # x64 only: built on an Apple-silicon Mac, electron-builder would otherwise
  # make ARM installers that ordinary Intel/AMD lab PCs can't run.
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon-student.png
  extraResources:
    - from: native/windows
      to: native/windows
nsis:
  # Silent, machine-wide install for deployment tools: "ClassMonitor Student Setup.exe /S"
  oneClick: true
  perMachine: true
  # Opens UDP 47800 for teacher discovery beacons.
  include: build/student-installer.nsh
